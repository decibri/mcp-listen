name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: 'Tick to actually publish. Unticked = dry run (install, test, verify-pack only; no publish).'

permissions:
  # `contents: write` permits the `gh release create` step.
  # `id-token: write` is required for npm Trusted Publisher OIDC token
  # issuance.
  contents: write
  id-token: write

jobs:
  preflight:
    name: Preflight (version match)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            echo "::notice::DRY RUN MODE (workflow_dispatch with publish=false). No publish will occur."
          else
            echo "Publishing run. Trigger: ${{ github.event_name }}. Tag: ${{ github.ref_name }}"
          fi

      - name: Assert tag version matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Tag form: refs/tags/v0.2.0 -> TAG_VERSION=0.2.0
          # Pre-release tags (v0.2.0-rc.1) are allowed; the suffix is
          # preserved and must match the manifest if used.
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Tag version: ${TAG_VERSION}"

          # jq is preinstalled on ubuntu-latest runners; no setup needed.
          PKG_VERSION=$(jq -r .version package.json)
          echo "package.json: ${PKG_VERSION}"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            echo ""
            echo "Release aborted: version mismatch detected."
            echo "Bump package.json (and package-lock.json and server.json) to ${TAG_VERSION}, then re-tag."
            exit 1
          fi

          echo "OK: tag and package.json agree on ${TAG_VERSION}"

  # Everything that is not the publish itself lives here, outside the `npm`
  # environment, so a workflow_dispatch dry run can execute the full
  # install / test / pack-verification path without tripping the
  # environment's `v*` tag restriction.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Node 22 (current LTS), not 20. npm 12 requires Node 22, 24, or 26,
          # so `npm install -g npm@latest` on Node 20 now fails outright at the
          # toolchain step. Pinning npm to 11.x instead would work, but leaves
          # this workflow on an ageing Node line.
          node-version: '22'
          # Trusted publishing does not remove the need for this: it writes
          # the .npmrc that points npm at the registry. Only the token goes.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1. Without this upgrade
        # the publish falls back to token auth, finds no token, and fails.
        # The assertion exists because a silent no-op here is the most
        # expensive failure mode: it surfaces at the publish step as an auth
        # error that looks nothing like a toolchain problem.
        shell: bash
        run: |
          npm install -g npm@latest
          NPM_VERSION=$(npm --version)
          echo "npm ${NPM_VERSION}"
          MAJOR=$(echo "$NPM_VERSION" | cut -d. -f1)
          MINOR=$(echo "$NPM_VERSION" | cut -d. -f2)
          PATCH=$(echo "$NPM_VERSION" | cut -d. -f3)
          if [ "$MAJOR" -lt 11 ] \
            || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; } \
            || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -eq 5 ] && [ "$PATCH" -lt 1 ]; }; then
            echo "ERROR: npm ${NPM_VERSION} does not support OIDC trusted publishing (need >= 11.5.1)"
            echo "The npm upgrade step did not take effect. Check the Node version against npm's engine floor."
            exit 1
          fi
          echo "OK: npm ${NPM_VERSION} supports trusted publishing"

      - name: Install ALSA runtime (Linux)
        # decibri's native addon links ALSA on Linux. Required since decibri
        # 5.x. Mirrors the platform setup in the decibri repo's own build
        # matrix.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run smoke tests
        run: npm test

      - name: Build the publish package
        # The package is published from the generated dist/ directory, not
        # from the repo root: scripts/build-package.js writes a manifest
        # containing only an explicit allowlist of consumer-facing fields
        # (no scripts, no devDependencies) and copies the runtime files in.
        # The source package.json is read, never written.
        run: node scripts/build-package.js

      - name: Verify npm package contents (pre-publish gate)
        # Defense-in-depth: verify npm package contents before any publish.
        # Runs in both publish and dry-run modes, against the generated
        # dist/ directory that actually gets published. The forbidden
        # patterns exist because the maintainer working tree holds
        # gitignored registry credentials (.mcpregistry_*), a publisher
        # binary (mcp-publisher.exe), and a local runbook (CLAUDE.local.md);
        # this gate stops them ever reaching a tarball if .gitignore or the
        # build script slips.
        #
        # The manifest checks are the field-level equivalent of the file
        # checks: the published manifest is generated from an allowlist,
        # and this gate fails the release if a development-only field
        # (scripts, devDependencies) appears in it anyway. jq reads
        # dist/package.json directly because `npm pack --dry-run --json`
        # reports the file list, not the manifest contents.
        #
        # The shape check is not paranoia. npm 10 emitted an array of packed-
        # package records from `npm pack --dry-run --json`; npm 12 emits an
        # object keyed by package name (verified against real npm 12.0.1
        # output, which this step prints to the run log). A bare record object
        # is also accepted as a middle ground. Hard-coding any one shape breaks
        # on the next npm major, so accept the known shapes and fail loudly if
        # none yields a file list. A gate that checks a file list must never
        # pass because the file list came back empty.
        shell: bash
        run: |
          set -o pipefail
          FAIL=0

          PACK_JSON=$(npm pack --dry-run --json ./dist)
          echo "Raw npm pack output:"
          echo "$PACK_JSON"
          echo ""

          files=$(echo "$PACK_JSON" | jq -r '
            if type == "array" then .[0]
            elif has("files") then .
            else first(.[] | objects | select(has("files")))
            end
            | .files[].path')

          if [ -z "$files" ]; then
            echo "ERROR: could not extract a file list from 'npm pack --dry-run --json'."
            echo "The output schema has probably changed again. Raw output is above."
            echo "This gate must never pass on an empty file list."
            exit 1
          fi

          echo "Would pack:"
          echo "$files" | sort | sed 's/^/  * /'
          echo ""

          for f in \
            package.json \
            index.js \
            lib/audio.js \
            lib/cleanup.js \
            lib/llm.js \
            lib/transcribe.js \
            lib/validate.js \
            lib/wav.js \
            README.md \
            LICENSE \
            ATTRIBUTION.md
          do
            if echo "$files" | grep -Fxq "$f"; then
              echo "  [OK]   required present: $f"
            else
              echo "  [FAIL] required MISSING: $f"
              FAIL=1
            fi
          done

          for p in '\.mcpregistry' 'mcp-publisher' '\.exe$' '^test/' '\.claude' 'CLAUDE\.local'
          do
            matches=$(echo "$files" | grep -E "$p" || true)
            if [ -n "$matches" ]; then
              echo "  [FAIL] forbidden pattern '$p' matched:"
              echo "$matches" | sed 's/^/         /'
              FAIL=1
            else
              echo "  [OK]   forbidden absent: $p"
            fi
          done

          echo ""
          echo "Published manifest (dist/package.json) field checks:"
          for field in scripts devDependencies
          do
            if jq -e --arg f "$field" 'has($f)' dist/package.json > /dev/null; then
              echo "  [FAIL] published manifest must not carry: $field"
              echo "         got: $(jq -c --arg f "$field" '.[$f]' dist/package.json)"
              FAIL=1
            else
              echo "  [OK]   manifest field absent: $field"
            fi
          done

          echo ""
          if [ "$FAIL" -ne 0 ]; then
            echo "================================================"
            echo "  VERIFICATION FAILED - not publish-ready"
            echo "================================================"
            exit 1
          fi
          echo "Package passes verification."

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [preflight, verify]
    # Job-level `if` is load-bearing, not cosmetic. The `npm` environment
    # restricts deployments to `v*` tags. If this job merely skipped the
    # publish *step* on a dry run, the job would still start, GitHub would
    # evaluate the environment protection rules against a branch ref, and the
    # run would fail. A job skipped by a job-level `if` never evaluates its
    # environment at all.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    # Required-reviewer protection on this environment gates the publish
    # behind a manual approval in the Actions UI. The environment's `v*` tag
    # rule additionally makes publishing from a branch impossible by policy,
    # not merely by convention.
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Node 22 (current LTS), not 20. npm 12 requires Node 22, 24, or 26,
          # so `npm install -g npm@latest` on Node 20 now fails outright at the
          # toolchain step. Pinning npm to 11.x instead would work, but leaves
          # this workflow on an ageing Node line.
          node-version: '22'
          # Trusted publishing does not remove the need for this: it writes
          # the .npmrc that points npm at the registry. Only the token goes.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1. Without this upgrade
        # the publish falls back to token auth, finds no token, and fails.
        # The assertion exists because a silent no-op here is the most
        # expensive failure mode: it surfaces at the publish step as an auth
        # error that looks nothing like a toolchain problem.
        shell: bash
        run: |
          npm install -g npm@latest
          NPM_VERSION=$(npm --version)
          echo "npm ${NPM_VERSION}"
          MAJOR=$(echo "$NPM_VERSION" | cut -d. -f1)
          MINOR=$(echo "$NPM_VERSION" | cut -d. -f2)
          PATCH=$(echo "$NPM_VERSION" | cut -d. -f3)
          if [ "$MAJOR" -lt 11 ] \
            || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; } \
            || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -eq 5 ] && [ "$PATCH" -lt 1 ]; }; then
            echo "ERROR: npm ${NPM_VERSION} does not support OIDC trusted publishing (need >= 11.5.1)"
            echo "The npm upgrade step did not take effect. Check the Node version against npm's engine floor."
            exit 1
          fi
          echo "OK: npm ${NPM_VERSION} supports trusted publishing"

      - name: Build the publish package
        # Same generated dist/ the verify job gated: the published manifest
        # is built from an explicit field allowlist (no scripts, no
        # devDependencies) and the runtime files are copied in. The build
        # needs no npm install; scripts/build-package.js uses only node:fs.
        run: node scripts/build-package.js

      # npm Trusted Publishing (OIDC) supplies auth automatically given
      # `id-token: write` and the registered trusted publisher record. No
      # NODE_AUTH_TOKEN is used, and no --provenance flag is passed:
      # provenance is generated automatically from the OIDC token. The
      # publish is gated on either a tag-push trigger or a
      # workflow_dispatch run with `publish: true`. Published from the
      # generated dist/ directory (cd, matching the decibri publish
      # workflows), never from the repo root.
      - name: Publish mcp-listen
        run: cd dist && npm publish --access public

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Verify npm publish
        if: github.event_name == 'push'
        # Strip the `v` prefix from the tag so the `npm view` lookup uses
        # the registry-side semver, not the literal tag name.
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Verifying npm registry view for mcp-listen@${VERSION}"
          sleep 30
          npm view "mcp-listen@${VERSION}"
